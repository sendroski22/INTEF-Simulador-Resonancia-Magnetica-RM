<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador: Resonancia magnética nuclear</title>
<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #juego {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
  }
  #juego ruffle-player,
  #juego ruffle-object,
  #juego ruffle-embed {
    width: 100%;
    height: 100%;
  }
  #botones {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #botones button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: rgb(0 0 0 / 0.55);
    color: #fff;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  #botones button:hover,
  #botones button:focus-visible { opacity: 1; }
  #botones svg { width: 16px; height: 16px; }
  #botones[hidden], #botones button[hidden] { display: none; }
  #mensaje {
    position: fixed;
    bottom: 12px;
    right: 58px;
    z-index: 11;
    max-width: min(360px, calc(100vw - 24px));
    padding: 10px 14px;
    border-radius: 8px;
    background: rgb(0 0 0 / 0.85);
    color: #fff;
    font: 14px/1.4 system-ui, sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #mensaje.visible { opacity: 1; }
  #aviso {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    padding: 2rem;
    text-align: center;
    font: 16px/1.5 system-ui, sans-serif;
    color: #fff;
    background: #000;
  }
</style>
<!-- Puente SCORM 2004 original (lo usa el SWF mediante ExternalInterface) -->
<script src="SCORM_API_wrapper.js"></script>
<script>
  var scorm = pipwerks.SCORM;
  scorm.version = "2004";
  window.addEventListener("pagehide", function () {
    if (scorm.connection.isActive) { scorm.quit(); }
  });
</script>
<!-- Ruffle: emulador de Flash en WebAssembly (incluido en la carpeta ruffle/) -->
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="botones">
  <button id="exportar" type="button" title="Exportar partidas guardadas a un archivo" aria-label="Exportar partidas guardadas a un archivo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
  </button>
  <button id="importar" type="button" title="Importar partidas desde un archivo" aria-label="Importar partidas desde un archivo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 20h16"/></svg>
  </button>
  <button id="pantallaCompleta" type="button" title="Pantalla completa" aria-label="Pantalla completa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>
<input id="archivoPartidas" type="file" accept=".json,application/json" hidden>
<div id="mensaje" role="status" aria-live="polite"></div>
<div id="juego"></div>
<div id="aviso">
  <p>Este simulador debe abrirse desde Moodle (paquete SCORM) o desde un servidor web.<br>
  Al abrir el archivo con doble clic, el navegador bloquea el emulador.</p>
</div>

<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    publicPath: "ruffle/",
    autoplay: "on",
    unmuteOverlay: "hidden",
    splashScreen: false,
    letterbox: "on",
    backgroundColor: "#FFFFFF",
    allowScriptAccess: true,
    allowNetworking: "all",
    quality: "best",
    contextMenu: "rightClickOnly",
    showSwfDownload: false,
    warnOnUnsupportedContent: false,
    openUrlMode: "allow",
    base: "./"
  };

  if (location.protocol === "file:") {
    document.getElementById("aviso").style.display = "grid";
  }

  window.addEventListener("load", function () {
    var ruffle = window.RufflePlayer.newest();
    var player = ruffle.createPlayer();
    player.id = "courseSWF";
    document.getElementById("juego").appendChild(player);
    player.ruffle().load({ url: "Simulador.swf" });
  });

  // Pantalla completa de toda la página (el juego se escala sin deformarse)
  var boton = document.getElementById("pantallaCompleta");
  boton.addEventListener("click", function () {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch(function () {});
    }
  });
  document.addEventListener("fullscreenchange", function () {
    var dentro = !!document.fullscreenElement;
    boton.title = dentro ? "Salir de pantalla completa" : "Pantalla completa";
    boton.setAttribute("aria-label", boton.title);
  });

  // ---- Partidas guardadas (solo fuera de Moodle) ----
  // El simulador guarda las sesiones con "Guardar sesión" en un SharedObject de Flash.
  // Ruffle lo conserva en el localStorage del navegador, con una clave que empieza por
  // <servidor>/<ruta>/Simulador.swf/. Estos botones copian esas claves a un archivo y viceversa.
  var SIMULADOR = "RM";
  var prefijo = location.hostname + new URL("Simulador.swf", location.href).pathname + "/";
  var mensaje = document.getElementById("mensaje");
  var temporizador;

  function avisar(texto) {
    mensaje.textContent = texto;
    mensaje.classList.add("visible");
    clearTimeout(temporizador);
    temporizador = setTimeout(function () { mensaje.classList.remove("visible"); }, 5000);
  }

  function hayLMS() {
    var w = window;
    for (var i = 0; i < 10 && w; i++) {
      try { if (w.API_1484_11 || w.API) { return true; } } catch (e) { return false; }
      if (w === w.parent) { break; }
      w = w.parent;
    }
    try { if (window.opener && (window.opener.API_1484_11 || window.opener.API)) { return true; } } catch (e) {}
    return false;
  }

  function clavesPartidas() {
    var claves = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(prefijo) === 0) { claves.push(k); }
      }
    } catch (e) {}
    return claves;
  }

  if (hayLMS()) {
    // En Moodle el avance se guarda por SCORM: no hacen falta estos botones
    document.getElementById("exportar").hidden = true;
    document.getElementById("importar").hidden = true;
  }

  document.getElementById("exportar").addEventListener("click", function () {
    var claves = clavesPartidas();
    if (!claves.length) {
      avisar("No hay partidas guardadas en este navegador. Primero usa Opciones → Guardar sesión.");
      return;
    }
    var datos = {};
    claves.forEach(function (k) { datos[k.slice(prefijo.length)] = localStorage.getItem(k); });
    var contenido = JSON.stringify({ formato: "partidas-simulador", simulador: SIMULADOR, fecha: new Date().toISOString(), datos: datos });
    var enlace = document.createElement("a");
    enlace.href = URL.createObjectURL(new Blob([contenido], { type: "application/json" }));
    enlace.download = "partidas-simulador-" + SIMULADOR + "-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(enlace);
    enlace.click();
    setTimeout(function () { URL.revokeObjectURL(enlace.href); enlace.remove(); }, 1000);
    avisar("Partidas exportadas. Guarda el archivo para importarlo en otro momento u otro ordenador.");
  });

  var entrada = document.getElementById("archivoPartidas");
  document.getElementById("importar").addEventListener("click", function () { entrada.click(); });
  entrada.addEventListener("change", function () {
    var archivo = entrada.files[0];
    entrada.value = "";
    if (!archivo) { return; }
    archivo.text().then(function (texto) {
      var json;
      try { json = JSON.parse(texto); } catch (e) { json = null; }
      if (!json || json.formato !== "partidas-simulador" || !json.datos) {
        avisar("Ese archivo no es un archivo de partidas del simulador.");
        return;
      }
      if (json.simulador !== SIMULADOR) {
        avisar("Ese archivo es de partidas del simulador de " + json.simulador + ", no de este (" + SIMULADOR + ").");
        return;
      }
      if (clavesPartidas().length && !confirm("Las partidas del archivo sustituirán a las que hay guardadas en este navegador. ¿Continuar?")) {
        return;
      }
      try {
        clavesPartidas().forEach(function (k) { localStorage.removeItem(k); });
        Object.keys(json.datos).forEach(function (k) { localStorage.setItem(prefijo + k, json.datos[k]); });
      } catch (e) {
        avisar("No se han podido importar las partidas: el navegador no permite guardar datos.");
        return;
      }
      alert("Partidas importadas. El simulador se va a reiniciar; después usa Opciones → Cargar sesión.");
      location.reload();
    });
  });
</script>
</body>
</html>
